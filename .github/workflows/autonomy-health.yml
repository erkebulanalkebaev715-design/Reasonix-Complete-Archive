name: Reasonix Autonomous Health

on:
  push:
    branches: [main, next]
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reasonix-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Full trusted validation
        env:
          GOTOOLCHAIN: local
        run: python3 automation/validate_candidate.py --candidate . --full
