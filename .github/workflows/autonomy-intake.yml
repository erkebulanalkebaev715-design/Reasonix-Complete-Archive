name: Reasonix Autonomous Intake

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [next]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  dispatch:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact candidate to trusted gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "ref": "main",
            "inputs": {
              "pr": str(os.environ["PR"]),
              "head_sha": os.environ["HEAD_SHA"]
            }
          }))
          PY
          )
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autonomy-candidate.yml/dispatches" \
            -d "$payload"
          echo "AUTONOMY_DISPATCHED pr=$PR sha=$HEAD_SHA"
