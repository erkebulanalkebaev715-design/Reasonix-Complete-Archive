function swarmDetail(s){const rows=Object.values(s.tasks||{}).sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true})).map(t=>{const ev=(t.evidence||[]).map(e=>String(e.kind||'')).filter(Boolean).join(', ');const fail=t.failure?`<div class=repeatWarn>${I('swarmFailures')}: ${esc(t.failure.message||t.failure.class||'')}${t.failure.retries?' ×'+t.failure.retries:''}</div>`:'';return `<div class=activityGroup><div class=activityHead><span class=activityIcon>${t.status==='succeeded'?'✓':t.status==='failed'?'✗':t.status==='cancelled'?'⌀':'…'}</span><div class=activityMain><div class=activityTitle>${esc(t.id)} · ${esc(t.profile||I('agent'))}</div><div class=activitySub>${esc(taskStatusName(t.status))}${t.provider?' · '+esc(t.provider):''}${t.model?' · '+esc(t.model):''}${t.workerId?' · '+I('swarmWorkerId')+' '+esc(t.workerId):''}${t.attempts>1?' · ×'+t.attempts:''}</div>${(t.scope||[]).length?`<div class=activitySub>${esc(t.scope.join(', '))}</div>`:''}${ev?`<div class=activitySub>${I('swarmEvidence')}: ${ev}</div>`:''}${t.result&&t.result.summary?`<div class=activitySub>${esc(t.result.summary)}</div>`:''}${fail}</div></div></div>`}).join('');const findings=(s.findings||[]).map(f=>`<div class=activitySub>◈ ${esc(f.summary||f.ref||f.id||'')}${f.verified?' · '+I('swarmVerified'):''}</div>`).join('');const b=s.budget||{};const provCost=Object.entries(b.providers||{}).map(([k,v])=>`${esc(k)}: ${Number(v).toFixed(6)}`).join(' · ');return `<div class=reasonBox><strong>${esc(swarmStatusName(s.status))}</strong>${s.verified?' · '+I('swarmVerified'):''}${s.failed?' · '+I('swarmStatusFailed'):''} · <small>${esc(fmtTime(s.updatedAt)||'')}</small><br>${I('swarmId')}: ${esc(s.id)}</div>${(b.costSpent!=null||b.requests!=null)?`<div class=reasonBox>${I('swarmBudget')}${b.requests!=null?' · '+I('swarmReqs')+' '+b.requests:''}${b.tokensSpent!=null?' · '+I('swarmTokens')+' '+b.tokensSpent:''}${b.costSpent!=null?' · '+I('swarmCost')+' '+Number(b.costSpent).toFixed(6):''}${provCost?' · '+provCost:''}</div>`:''}${findings?`<div class=reasonBox>${findings}</div>`:''}${s.result?`<div class=reasonBox>${esc(s.result)}</div>`:''}${rows||`<div class=reasonBox>${I('swarmEmpty')}</div>`}`}
function swarmSummary(s){const running=s.status==='running'||s.status==='planned';const tasks=Object.values(s.tasks||{});const byProfile={};for(const t of tasks){const p=t.profile||I('agent');byProfile[p]=byProfile[p]||[0,0,0];if(t.status==='succeeded')byProfile[p][0]++;else if(t.status==='failed'||t.status==='cancelled')byProfile[p][1]++;else byProfile[p][2]++}const chips=Object.entries(byProfile).map(([p,c])=>`<span class=count>${esc(p)}${c[0]?' ✓'+c[0]:''}${c[2]?' …'+c[2]:''}${c[1]?' ✗'+c[1]:''}</span>`).join('');const sec=Math.max(1,Math.round((Date.now()-new Date(s.updatedAt).getTime())/1000));const status=running?I('swarmRunning')+' · '+sec+'s':esc(swarmStatusName(s.status));return `<div class="work ${running?'live':''}" data-swarm=1 data-id="${esc(s.id)}"><button class=workToggle><span class=spark>◈</span><div class=grow><div class=workTitle>${esc(s.objective||s.id)}</div><div class=workStatus>${status}${chips?' · '+chips:''}</div></div><span class=chev>⌄</span></button><div class=workBody><div class=workInner><div class=workContent>${swarmDetail(s)}</div></div></div></div>`}
function wireSwarmToggle(){$$('[data-swarm] .workToggle').forEach(b=>b.onclick=()=>{const w=b.closest('[data-swarm]');if(w)w.classList.toggle('open')})}
async function refreshSwarmUI(){const box=$('#plusSwarm');if(!box)return;if(!state.connected){box.innerHTML=`<div class=sub>${I('backendOff')}</div>`;return}const startBtn=$('#swarmStartBtn'),cancelBtn=$('#swarmCancelBtn');let s=null,err='';try{const r=await req('/mod/swarm',{timeoutMs:8000});s=r.data}catch(e){err=e.message}swarmState=s;if(startBtn)startBtn.disabled=!!(s&&(s.status==='running'||s.status==='planned'));if(cancelBtn)cancelBtn.style.display=s&&(s.status==='running'||s.status==='planned')?'':'none';const st=$('#swarmStatus');if(st)st.innerHTML=s?swarmSummary(s):`<div class=sub>${I('swarmNoSwarm')}</div>`;wireSwarmToggle();await renderSwarmHistory()}
async function renderSwarmHistory(){const box=$('#swarmHistory');if(!box)return;let list=[];try{const d=(await req('/mod/swarm/history',{timeoutMs:8000})).data||{};list=Array.isArray(d.swarms)?d.swarms:[]}catch(e){box.innerHTML=`<div class=sub>${I('swarmNoHistory')}</div>`;return}box.innerHTML=`<div class=sub style="margin-top:10px"><b>${I('swarmHistory')}</b></div>`+(list.length?list.slice(0,10).map(x=>`<div class=sheetRow data-swarm-open="${esc(x.id)}"><span>◈</span><div class=grow><b>${esc(x.objective||x.id)}</b><small>${esc(swarmStatusName(x.status))} · ${esc(fmtTime(x.updatedAt))}</small></div></div>`).join(''):`<div class=sub>${I('swarmNoHistory')}</div>`);$$('#swarmHistory [data-swarm-open]').forEach(r=>r.onclick=async()=>{try{const x=(await req('/mod/swarm/'+encodeURIComponent(r.dataset.swarmOpen),{timeoutMs:8000})).data;swarmState=x;const st=$('#swarmStatus');if(st)st.innerHTML=swarmSummary(x);wireSwarmToggle();toast(I('swarmLoaded'))}catch(e){toast(e.message)}})}
async function pollSwarm(){if(!state.connected||state.swarmPolling)return;state.swarmPolling=true;try{const r=await req('/mod/swarm',{timeoutMs:6000});if(r.status===200)swarmState=r.data}catch(e){if(String(e.message||'').includes('404'))swarmState=null}finally{state.swarmPolling=false;renderDrawerActivity()}}

function renderAll(){renderStatic();renderDrawerActivity();restoreDraft()}renderAll();document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(state.poll);state.poll=null}else if(state.connected)startPoll()});setTimeout(async()=>{try{await req('/mobile/health',{timeoutMs:3500});if(state.token)connect();else setConnText(I('backendFound'))}catch{}},250);
})();
</script></body></html>
